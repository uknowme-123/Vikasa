; Vikāsa ESP32 Firmware - PlatformIO Configuration
; Build with: pio run
; Test with: pio test
; Monitor with: pio device monitor

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags = 
    -D FIRMWARE_VERSION=\"0.1.0\"
    -D DEVELOPMENT_MODE=0
    -Wall
    -Wextra
    -Wpedantic
    -std=gnu++17

; Development environment with test mode enabled
[env:esp32dev-dev]
extends = env:esp32dev
build_flags = 
    -D FIRMWARE_VERSION=\"0.1.0-dev\"
    -D DEVELOPMENT_MODE=1
    -Wall
    -Wextra
    -Wpedantic
    -std=gnu++17

; Test environment (native for unit tests)
[env:native-test]
platform = native
board = uno
framework = arduino
build_flags = 
    -D DEVELOPMENT_MODE=1
    -D UNIT_TEST=1
    -Wall
    -Wextra
    -Wpedantic
    -std=gnu++17
    -I include
    -I src
test_filter = test_*

; Library dependencies
lib_deps = 
    ; ArduinoJson for JSON handling (if needed beyond manual serialization)
    ; bblanchon/ArduinoJson@^7.0.0
    
    ; NTP/Time handling
    ; ESP32 time.h is built-in

; Custom build script for version info
extra_scripts = 
    pre:build_version.py

; Upload configuration
upload_protocol = esptool
upload_speed = 921600

; Partition scheme (default works for most cases)
; board_build.partitions = default_16MB.csv

; Debug configuration
debug_tool = esp-prog
debug_init_break = tbreak setup